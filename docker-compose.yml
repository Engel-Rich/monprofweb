version: '3.9'

services:
    # Service pour le serveur web
    nginx:
        image: nginx:1.22-alpine
        restart: always
        container_name: nginx-monprof
        ports:
            - 8800:80
            - 8443:443
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./:/www/html/monprof
        depends_on:
            - php
    php:
        restart: always
        build: .
        volumes:
            - ./:/www/html/monprof
        environment:
            - DB_CONNECTION=mysql
            - DB_HOST=194.163.141.34
            - DB_PORT=3306
            - DB_DATABASE=monprof_base
            - DB_USERNAME=richelieu
            - DB_PASSWORD=Azerty@123
        expose:
            - 9000
   
