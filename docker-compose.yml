services:
    # Service pour le serveur web
    nginx:
        image: nginx:1.22-alpine
        restart: always
        container_name: nginx-monprof
        ports:
            - 8800:80
            - 8443:443
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./:/www/html/monprof
        depends_on:
            - php
    php:
        restart: always
        container_name: monprof-api
        build: .
        volumes:
            - ./:/www/html/monprof
        env_file:
            .env        
        expose:
            - 9000
    adminer:
        image: adminer
        restart: always
        ports:
            - "8082:8080"
