[supervisord]
nodaemon=true

[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm.error.log

[program:laravel-queue]
command=php /www/html/monprof/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www
# numprocs=8
stdout_logfile=/var/log/laravel-queue.log
stderr_logfile=/var/log/laravel-queue.error.log

[program:laravel-migrations]
command=php /www/html/monprof/artisan migrate --force
autostart=true
autorestart=false
startretries=1